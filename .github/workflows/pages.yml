name: Publish Grapleton prototype
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grapleton-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check and stage the static app
        run: |
          for script in app.js store.js sw.js; do node --check "$script" || exit; done
          mkdir _site
          cp -r index.html style.css app.js store.js sw.js manifest.webmanifest assets _site/
          sed -i "s/grapleton-shell-v1/grapleton-shell-${GITHUB_SHA}/" _site/sw.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
